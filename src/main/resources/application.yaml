spring:
  application:
    name: balfouriana
  servlet:
    multipart:
      max-file-size: 52MB
      max-request-size: 52MB
  datasource:
    url: ${BALFOURIANA_DB_URL:jdbc:h2:mem:balfouriana;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${BALFOURIANA_DB_USERNAME:sa}
    password: ${BALFOURIANA_DB_PASSWORD:}
    driver-class-name: ${BALFOURIANA_DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
  pattern:
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level app=${spring.application.name} corr=%X{correlationId:-none} thread=%thread logger=%logger{36} msg=%msg%n"

balfouriana:
  runtime:
    service-identity: ${BALFOURIANA_SERVICE_IDENTITY:balfouriana-core}
  ingestion:
    root: ${BALFOURIANA_INGEST_ROOT:./data/ingest}
    receive-schema-version: ingestion.receive.v1
    rest:
      max-file-size-bytes: ${BALFOURIANA_INGEST_MAX_BYTES:52428800}
      api-key: ${BALFOURIANA_INGESTION_API_KEY:}
    drop-zone:
      enabled: ${BALFOURIANA_DROP_ZONE_ENABLED:true}
      poll-interval-ms: ${BALFOURIANA_DROP_ZONE_POLL_MS:5000}
      stability-check-ms: ${BALFOURIANA_DROP_ZONE_STABILITY_MS:2000}
  filing:
    step4:
      enabled: ${BALFOURIANA_STEP4_ENABLED:true}
      schema-validation:
        enabled: ${BALFOURIANA_STEP4_SCHEMA_VALIDATION_ENABLED:true}
      submission:
        mode: ${BALFOURIANA_STEP4_SUBMISSION_MODE:LOCAL_OUTBOX}
        channel: ${BALFOURIANA_STEP4_SUBMISSION_CHANNEL:LOCAL_OUTBOX}
        local-outbox-dir: ${BALFOURIANA_STEP4_LOCAL_OUTBOX_DIR:./data/filing/outbox}
        remote-base-path: ${BALFOURIANA_STEP4_REMOTE_BASE_PATH:/outbound}
        sftp:
          host: ${BALFOURIANA_STEP4_SFTP_HOST:}
          port: ${BALFOURIANA_STEP4_SFTP_PORT:22}
          username: ${BALFOURIANA_STEP4_SFTP_USERNAME:}
          password: ${BALFOURIANA_STEP4_SFTP_PASSWORD:}
          private-key-path: ${BALFOURIANA_STEP4_SFTP_PRIVATE_KEY_PATH:}
          remote-directory: ${BALFOURIANA_STEP4_SFTP_REMOTE_DIR:/outbound}
      acknowledgement:
        channel: ${BALFOURIANA_STEP4_ACK_CHANNEL:SFTP}
        drop-zone:
          enabled: ${BALFOURIANA_STEP4_ACK_DROP_ZONE_ENABLED:true}
          root: ${BALFOURIANA_STEP4_ACK_ROOT:./data/filing/ack}
          poll-interval-ms: ${BALFOURIANA_STEP4_ACK_POLL_MS:5000}
          stability-check-ms: ${BALFOURIANA_STEP4_ACK_STABILITY_MS:2000}
  ops:
    exception-queue:
      lookback-hours: ${BALFOURIANA_EXCEPTION_QUEUE_LOOKBACK_HOURS:168}
      default-limit: ${BALFOURIANA_EXCEPTION_QUEUE_LIMIT:100}
    audit-export:
      default-limit: ${BALFOURIANA_AUDIT_EXPORT_DEFAULT_LIMIT:500}
      max-limit: ${BALFOURIANA_AUDIT_EXPORT_MAX_LIMIT:5000}
      default-lookback-hours: ${BALFOURIANA_AUDIT_EXPORT_LOOKBACK_HOURS:168}
  demo:
    data-dir: ${BALFOURIANA_DEMO_DATA_DIR:./balfouriana-demo-data}
